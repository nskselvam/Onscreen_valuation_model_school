# ═══════════════════════════════════════════════════════════════════════════
# POSTGRESQL PERFORMANCE TUNING
# System: 64 GB RAM, 32 CPU Cores, SSD Storage
# Workload: High-concurrency OLTP with heavy read/write operations
# ═══════════════════════════════════════════════════════════════════════════
# 
# INSTRUCTIONS:
# 1. Backup current postgresql.conf: sudo cp /etc/postgresql/*/main/postgresql.conf /etc/postgresql/*/main/postgresql.conf.backup
# 2. Edit config: sudo nano /etc/postgresql/*/main/postgresql.conf
# 3. Apply these settings (append or replace existing values)
# 4. Restart PostgreSQL: sudo systemctl restart postgresql
# 5. Verify: psql -c "SHOW shared_buffers;" -c "SHOW effective_cache_size;"
#
# ═══════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
# MEMORY SETTINGS (64 GB RAM)
# ─────────────────────────────────────────────────────────────────────────────

# Shared memory for caching data (25% of RAM = 16 GB)
shared_buffers = 16GB

# Query planner's assumption of cache size (50% of RAM = 32 GB)
effective_cache_size = 32GB

# Memory for complex operations per query (RAM / max_connections / 2)
# 64GB / 400 / 2 = ~80MB
work_mem = 128MB

# Memory for maintenance operations (5% of RAM = 3.2 GB)
maintenance_work_mem = 4GB

# Memory for autovacuum workers
autovacuum_work_mem = 2GB

# Huge pages (requires OS configuration)
huge_pages = try

# ─────────────────────────────────────────────────────────────────────────────
# CONNECTIONS & WORKERS (32 CPU Cores)
# ─────────────────────────────────────────────────────────────────────────────

# Max simultaneous connections (15 PM2 + clients + admin)
max_connections = 400

# Background workers for parallel queries (up to 50% of CPUs)
max_worker_processes = 16
max_parallel_workers_per_gather = 8
max_parallel_workers = 16
max_parallel_maintenance_workers = 8

# ─────────────────────────────────────────────────────────────────────────────
# WRITE-AHEAD LOG (WAL) - SSD Optimized
# ─────────────────────────────────────────────────────────────────────────────

# WAL buffer (16 MB for high-throughput)
wal_buffers = 16MB

# Min size of WAL file before checkpoint (4 GB)
min_wal_size = 4GB
max_wal_size = 16GB

# Checkpoint settings (spread I/O load)
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# WAL writer delay (reduce for better write performance on SSD)
wal_writer_delay = 200ms

# Write optimization
synchronous_commit = on  # Change to 'off' for extreme performance (risks data loss)
commit_delay = 1000  # Microseconds to wait before commit
commit_siblings = 5

# ─────────────────────────────────────────────────────────────────────────────
# QUERY PLANNER
# ─────────────────────────────────────────────────────────────────────────────

# Cost estimates (SSD is much faster)
random_page_cost = 1.1  # SSD (HDD default is 4.0)
effective_io_concurrency = 200  # SSD can handle many concurrent I/O
seq_page_cost = 1.0

# Enable JIT compilation for complex queries (PostgreSQL 11+)
jit = on
jit_above_cost = 100000

# ─────────────────────────────────────────────────────────────────────────────
# AUTOVACUUM (Critical for Performance)
# ─────────────────────────────────────────────────────────────────────────────

# Enable autovacuum
autovacuum = on

# Number of autovacuum workers (increase for large DBs)
autovacuum_max_workers = 8

# Naptime between runs
autovacuum_naptime = 10s

# Vacuum thresholds
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.05

# Vacuum cost limits (adjust for I/O capacity)
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 3000

# ─────────────────────────────────────────────────────────────────────────────
# LOGGING & MONITORING
# ─────────────────────────────────────────────────────────────────────────────

# Log slow queries (adjust threshold as needed)
log_min_duration_statement = 1000  # Log queries > 1 second

# Connection logging
log_connections = on
log_disconnections = on

# Statement logging
log_statement = 'mod'  # Log all data-modifying statements

# Performance stats
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 10000

# Query planning
log_lock_waits = on
log_checkpoints = on
log_autovacuum_min_duration = 250ms

# ─────────────────────────────────────────────────────────────────────────────
# REPLICATION (if using streaming replication)
# ─────────────────────────────────────────────────────────────────────────────

# wal_level = replica
# max_wal_senders = 10
# max_replication_slots = 10
# hot_standby = on

# ─────────────────────────────────────────────────────────────────────────────
# CONNECTION POOLING (PgBouncer - Optional but Recommended)
# ─────────────────────────────────────────────────────────────────────────────
# Install PgBouncer to reduce connection overhead:
# sudo apt install pgbouncer
# Edit /etc/pgbouncer/pgbouncer.ini:
#
# [databases]
# onscreen_valuation = host=127.0.0.1 port=5432 dbname=onscreen_valuation
#
# [pgbouncer]
# listen_addr = 127.0.0.1
# listen_port = 6432
# pool_mode = transaction
# max_client_conn = 1000
# default_pool_size = 50
# reserve_pool_size = 25
# ═══════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
# KERNEL PARAMETERS (Add to /etc/sysctl.conf)
# ─────────────────────────────────────────────────────────────────────────────
# For 64GB RAM and PostgreSQL optimization:
#
# # Shared memory settings
# kernel.shmmax = 68719476736    # 64 GB
# kernel.shmall = 16777216       # 64 GB / 4KB
# 
# # Network tuning
# net.core.somaxconn = 4096
# net.ipv4.tcp_max_syn_backlog = 4096
# net.ipv4.ip_local_port_range = 10000 65535
# net.core.rmem_max = 134217728
# net.core.wmem_max = 134217728
# 
# # Virtual memory
# vm.swappiness = 10              # Reduce swapping
# vm.dirty_ratio = 15             # Flush dirty pages at 15%
# vm.dirty_background_ratio = 5   # Start background flush at 5%
# vm.overcommit_memory = 2        # Don't overcommit
# 
# Apply with: sudo sysctl -p
# ─────────────────────────────────────────────────────────────────────────────
